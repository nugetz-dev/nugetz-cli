name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Nugetz.Cli.Tests/Nugetz.Cli.Tests.csproj
      - run: dotnet build Nugetz.Cli.csproj -c Release --no-restore
      - run: dotnet test Nugetz.Cli.Tests/Nugetz.Cli.Tests.csproj -c Release --no-restore
